name: Remove Note.ps1 if included in a Push

on:
  push:
    branches:
      - '**'

jobs:
  check-and-delete-file:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check if Note.ps1 exists
      id: check_existence
      run: |
        if [ -f "Note.ps1" ]; then
          echo "Note_exists=true" >> $GITHUB_OUTPUT
        else
          echo "Note_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Delete Note.ps1 if it exists
      if: steps.check_existence.outputs.Note_exists == 'true'
      run: |
        git config --global user.email "Note-action@noreply.github.com"
        git config --global user.name "Note-action"
        git rm Note.ps1
        git commit -m "Delete Note.ps1 as it is not allowed"
        git push origin HEAD:${{ github.ref }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
